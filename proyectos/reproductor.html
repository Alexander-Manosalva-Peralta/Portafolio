<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reproductor 3D — Composiciones IA | Proyecto de Yojan Manosalva</title>
  <style>
    :root{
      --bg-top:#1d1c20;
      --bg-bottom:#4b4a4f;
      --hud-bg:rgba(36,36,36,0.55);
      --player-bg:rgba(22,22,22,0.78);
      --accent-1:#b02a37;
      --accent-1:#b02a37;;
      --card-size:250px;
      --card-radius:20px;
      font-family: "Inter", system-ui, -apple-system, 'Segoe UI', Roboto, Arial;
    }

    html,body{
      height:100%;margin:0;
      background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
      background-image:url('../assets/img/fondo14.jpg'); /* 🌆 Cambia aquí tu fondo */
      background-size:cover;
      background-position:center;
      display:flex;align-items:center;justify-content:center;
      color:#fff;
      overflow:hidden;
    }

    .stage{
      width:1180px;height:720px;border-radius:12px;
      position:relative;overflow:hidden;
      box-shadow:0 30px 80px rgba(0,0,0,0.6);
      background:rgba(0,0,0,0.45);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
    }

    .hud-top{
      position:absolute;top:28px;left:50%;transform:translateX(-50%);
      z-index:30;display:flex;gap:12px;
      background:var(--hud-bg);backdrop-filter:blur(8px);
      padding:10px 18px;border-radius:30px;color:#fff;font-weight:700;font-size:14px;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }
    .hud-top button{background:transparent;border:0;color:inherit;padding:8px 12px;border-radius:18px;cursor:pointer}
    .hud-top button.active{background:rgba(255,255,255,0.06)}

    /* === CARRUSEL CENTRADO === */
    .carousel-wrap{
      position:relative;
      z-index:8;
      width:100%;
      height:420px;
      display:flex;
      align-items:center;
      justify-content:center;
      perspective:1800px;
      margin-top:60px;
    }

    .carousel{
      width:760px;
      height:360px;
      transform-style:preserve-3d;
      transition:transform 600ms cubic-bezier(.22,.9,.38,1);
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .card{
      position:absolute;
      top:50%;
      left:50%;
      width:var(--card-size);
      height:var(--card-size);
      transform-style:preserve-3d;
      translate:-50% -50%;
      border-radius:var(--card-radius);
      overflow:hidden;
      box-shadow:0 30px 60px rgba(0,0,0,0.45);
      transition:transform 700ms cubic-bezier(.22,.9,.38,1),opacity 500ms ease,filter 400ms;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(255,255,255,0.04);
    }

    .card .cover{
      width:100%;height:100%;
      background-size:cover;
      background-position:center;
      display:block;
    }

    .card.center{
      transform:translate(-50%,-50%) scale(1.3) !important;
      z-index:100;
      filter:drop-shadow(0 40px 70px rgba(0,0,0,0.55));
    }

    .now-bubble{
      position:absolute;top:54%;
      transform:translateY(-50%);
      z-index:40;
      background:linear-gradient(180deg,rgba(0,0,0,0.7),rgba(0,0,0,0.55));
      padding:10px 16px;
      border-radius:20px;
      font-weight:700;
      text-align:center;
      backdrop-filter:blur(6px);
    }

    /* === PLAYER === */
    .player{
      position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
      z-index:40;display:flex;align-items:center;gap:18px;
      background:var(--player-bg);backdrop-filter:blur(6px);
      padding:12px 18px;border-radius:30px;
      box-shadow:0 30px 70px rgba(0,0,0,0.6);
      width:78%;max-width:980px;color:#fff;justify-content:space-between;
    }

    .controls{display:flex;align-items:center;gap:12px}
    .icon-btn{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,0.05);display:grid;place-items:center;cursor:pointer;font-weight:800}
    .icon-btn:hover{background:rgba(255,255,255,0.15);}
    /* 🎨 Cambiar color azul del control de volumen */
#volRange {
  accent-color: var(--accent-1);
}


    .seek{flex:1;display:flex;align-items:center;gap:12px;margin:0 12px}
    .mini{display:flex;align-items:center;gap:12px;min-width:260px}
    .mini .thumb{width:56px;height:56px;border-radius:12px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,0.45)}
    .mini .meta{min-width:150px}
    .progress{height:10px;background:rgba(255,255,255,0.06);border-radius:999px;flex:1;overflow:hidden}
    .progress > i{display:block;height:100%;width:28%;border-radius:999px;background:linear-gradient(90deg,var(--accent-1),var(--accent-2))}
    .track-title{font-weight:800;font-size:14px}
    .track-sub{font-size:12px;opacity:0.9}

    /* === PANEL DE LETRAS (Rojo translúcido oscuro) === */
.lyrics-panel {
  position: absolute;
  right: 30px;
  bottom: 100px;
  width: 360px;
  max-height: 70vh;
  background: rgba(40, 0, 0, 0.30); /* 🔴 tono vino oscuro */
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 60, 60, 0.15);
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  padding: 20px;
  overflow-y: auto;
  overscroll-behavior: contain;
  color: #f8f8f8;
  font-size: 15px;
  line-height: 1.6;
  letter-spacing: 0.3px;
  opacity: 0;
  transform: translateY(20px) scale(0.98);
  transition: all 0.45s ease;
  white-space: pre-wrap;
  z-index: 15;
  pointer-events: auto;
}

/* cuando se muestra */
.lyrics-panel.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* === barra de desplazamiento personalizada === */
.lyrics-panel::-webkit-scrollbar {
  width: 6px;
}
.lyrics-panel::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.05);
  border-radius: 10px;
}
.lyrics-panel::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #ff3d3d, #6b0000); /* 🔥 degradado rojo oscuro */
  border-radius: 10px;
}
.lyrics-panel::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #ff5555, #8b0000);
}

/* === efecto al pasar el mouse === */
.lyrics-panel:hover {
  box-shadow: 0 12px 45px rgba(255, 60, 60, 0.25);
}

/* === animación de línea === */
.lyrics-line {
  opacity: 0.7;
  transition: all 0.3s ease;
}
.lyrics-line.active {
  opacity: 1;
  color: #ff4d4d; /* tono rojo brillante */
  text-shadow: 0 0 8px rgba(255, 80, 80, 0.8);
}

  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/main.css">
</head>
<body>
  <a href="../projects.html" class="btn-back" data-go-back>
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l4.88-4.88L11.29 4.7 3.29 12.7l8 8 1.42-1.42L7.83 13H20z"/></svg>
    Volver a proyectos
  </a>
  <div class="stage" id="stage">

    <div class="hud-top">
      <button>Listen Now</button>
      <button class="active">Browse</button>
      <button>Radio</button>
      <button>Playlists</button>
    </div>

    <div class="carousel-wrap">
      <div class="carousel" id="carousel"></div>
    </div>

    <div class="now-bubble" id="nowBubble"></div>

    <div class="player">
      <div class="controls">
        <div class="icon-btn" id="prev">⟨</div>
        <div class="icon-btn" id="play">▶</div>
        <div class="icon-btn" id="next">⟩</div>
      </div>

      <div class="seek">
        <div class="mini">
          <div class="thumb" id="miniThumb"></div>
          <div class="meta">
            <div class="track-title" id="tTitle"></div>
            <div class="track-sub" id="tArtist"></div>
          </div>
        </div>

        <div class="progress"><i id="progFill"></i></div>
        <div style="min-width:44px;text-align:right;font-weight:700" id="duration">0:00</div>
      </div>

      <div style="display:flex;gap:10px;align-items:center">
        <div class="icon-btn" id="volume">🔊</div>
        <input type="range" id="volRange" min="0" max="1" step="0.01" value="1">
        <div class="icon-btn" id="lyricsBtn">📝</div>
      </div>
    </div>

    <div class="lyrics-panel" id="lyricsPanel"></div>
  </div>

  <audio id="audioPlayer" preload="none"></audio>

  <script>
    /* === TUS CANCIONES, IMÁGENES Y LETRAS === */
    const albums = [
      {
        title: 'Lost in the Night',
        artist: 'Composición IA · Yojan',
        cover: '../assets/img/fondo5.jpg',
        song: '../assets/music/Lost in the Night.mp3',
        lyrics: `Yeah…
Late night in Miami, baby
(Sabes que me pierdo en tu piel…)
Uh-huh

Velvet skies, your lips so divine
Tú y yo, sin tiempo, sin line
In the club, your eyes meet mine
Whisper slow, “bésame otra time”
Lights low, feeling that tension
Bodies move sin dirección
In your touch, I lose control
Baby, you’re my bad intention

Boy, you know you drive me crazy
Tu perfume me tiene lazy
In your eyes I see the flame
You just wanna play the game

Lost in your midnight confessions
Entre tus labios, mis obsesiones
You say “te quiero”, maybe you don’t
But I’ll still come back for more
(Yeah, I’ll still come back for more)
Perdidos en la noche, sin razón
Tú y yo jugando con el corazón
You say “te quiero”, maybe you don’t
But I’ll still come back for more

Your hands on me, can’t fake it
La luna mira, we naked
I whisper soft, “don’t let go”
You said, “mi amor, despacio”
Copa de vino, slow temptation
Your lips, my salvation
I’m your muse, tu perdición
We both lost in this canción

Girl, you shine in the moonlight (moonlight)
Drippin’ gold on your skin so fine (so fine)
Siento el fuego cuando bailas (cuando bailas)
Baby, this night never dies

Lost in your midnight confessions
Entre tus labios, mis obsesiones
You say “te quiero”, maybe you don’t
But I’ll still come back for more
(Yeah, I’ll still come back for more)
Perdidos en la noche, sin razón
Tú y yo jugando con el corazón
You say “te quiero”, maybe you don’t
But I’ll still come back for more

(Yeah…)
Still come back for more…
Perdidos… en la noche…
Baby, I’ll still come back for more…`,
        accent1: '#ff9ae0', accent2: '#b3b7ff'
      },
      {
        title: 'Dime que no',
        artist: 'Composición IA · Yojan',
        cover: '../assets/img/poster.jpg',
        song: '../assets/music/Dime que no.mp3',
        lyrics: `Mmm…
You want me, don’t you?
But you can’t have me…
(Shh…)

Baby, you know what you’re doing…
Tú juegas con fuego…
And I’m already burning…

Tus ojos dicen más que tu voz
Me miras y pierdo el control
You touch me slow, like sin
Y el tiempo se rompe aquí
Tu nombre suena en mi piel
Aunque sé que esto está mal también
No digas nada, no finjas fe
Solo acércate otra vez

I know you like the danger
Y yo no sé decir que no
Eres mi culpa favorita
Mi adicción sin perdón
Te pienso cuando cae el sol
En mis sueños, pierdo el rol
Baby, dime que no otra vez
Pa’ volver a hacerlo bien

We don’t need no love tonight
Solo fuego y electricidad
In the dark, you feel so right
Aunque sé que va a doler más

Dime que no (tell me no)
Y mírame cuando mientas
Sabes que yo (know you know)
Caeré en tus promesas lentas
Perdidos los dos (lost control)
En besos que nunca cuentan
Dime que no (tell me no)
Pa’ que vuelva y me envenenas

You love my chaos, I know
Te gusta cuando me voy
Regreso rota, sin voz
Y tú esperándome hoy
El deseo es religión
Tu cuerpo, mi confesión
No somos lo que decimos ser
Solo lo que hacemos después

You move slow, I lose faith
Tus labios saben a mistake
No me salves, déjame caer
Si el infierno eres tú, está bien

Dime que no (tell me no)
Y mírame cuando mientas
Sabes que yo (know you know)
Caeré en tus promesas lentas
Perdidos los dos (lost control)
En besos que nunca cuentan
Dime que no (tell me no)
Pa’ que vuelva y me envenenas

You want me, don’t you?
Say it...
Say it again...

Dime que no…
Para volver… otra vez.`,
        accent1: '#2be57c', accent2: '#0b6c3a'
      },
      {
        title: 'Entre la Noche y la Ciudad',
        artist: 'Composición IA · Yojan',
        cover: '../assets/img/fondo16.jpg',
        song: '../assets/music/Entre la Noche y la Ciudad.mp3',
        lyrics: `Las luces bailan en el río
Sombras flotan en el frío
Un susurro que no puedo atrapar

Tu nombre escrito en el aire
Se borra como un eco suave
Y el tiempo no deja de escapar

Amor, un recuerdo que arde
Se disuelve, se esconde
Tarde, entre la noche y la ciudad

Amor, como un sueño en el mar
Se pierde, se hunde sin lugar
Entre la noche y la ciudad

Las calles llevan tu perfume
En cada esquina hay un resumen
De lo que fuimos, de lo que no será

El cielo negro guarda secretos
Y la luna escribe en sus cuadernos
Todo lo que nunca pude gritar

Amor, un recuerdo que arde
Se disuelve, se esconde
Tarde, entre la noche y la ciudad

Amor, como un sueño en el mar
Se pierde, se hunde sin lugar
Entre la noche y la ciudad

Amor, uh-ru-ru
Amor, uh-ru-ru
Amor, uh-ru-ru
Amor, uh-ru-ru

Las calles llevan tu perfume
En cada esquina hay un resumen
De lo que fuimos, de lo que no será

El cielo negro guarda secretos
Y la luna escribe en sus cuadernos
Todo lo que nunca pude gritar

Entre la noche y la ciudad`,
        accent1: '#ff7ab6', accent2: '#7ce3ff'
      },
    ];

    const carousel = document.getElementById('carousel');
    const miniThumb = document.getElementById('miniThumb');
    const progFill = document.getElementById('progFill');
    const nowBubble = document.getElementById('nowBubble');
    const tTitle = document.getElementById('tTitle');
    const tArtist = document.getElementById('tArtist');
    const duration = document.getElementById('duration');
    const audio = document.getElementById('audioPlayer');
    const lyricsPanel = document.getElementById('lyricsPanel');
    let idx = 0;
    const len = albums.length;
    const angleStep = 360 / len;
    const radius = 400;
    const spreadX = 320;

    albums.forEach((a, i)=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="cover" style="background-image:url('${a.cover}')"></div>`;
      card.addEventListener('click',()=>goTo(i));
      carousel.appendChild(card);
    });

    function render(){
      const cards = Array.from(carousel.children);
      cards.forEach((card,i)=>{
        let pos = i - idx;
        if(pos > len/2) pos -= len;
        if(pos < -len/2) pos += len;
        const angle = pos * angleStep;
        const rad = angle * Math.PI/180;
        const z = Math.cos(rad) * radius;
        const x = Math.sin(rad) * spreadX;
        const rotateY = angle;
        const scale = 0.85 + ((Math.cos(rad)+1)/2) * 0.45;
        const opacity = 0.12 + ((Math.cos(rad)+1)/2) * 0.96;
        card.style.transform = `translate(-50%,-50%) translateX(${x}px) translateZ(${z}px) rotateY(${rotateY}deg) scale(${scale})`;
        card.style.zIndex = Math.round(1000 - Math.abs(pos*20));
        card.style.opacity = opacity;
        card.classList.toggle('center', i===idx);
      });

      const a = albums[idx];
      nowBubble.innerHTML = `<strong style="font-size:15px">${a.title}</strong><br><span style="opacity:0.85;font-weight:600;font-size:13px">${a.artist}</span>`;
      tTitle.textContent = a.title;
      tArtist.textContent = `${a.artist}`;
      miniThumb.style.backgroundImage = `url('${a.cover}')`;
      progFill.style.background = `linear-gradient(90deg, ${a.accent1}, ${a.accent2})`;
      audio.src = a.song;
      lyricsPanel.textContent = a.lyrics;
      audio.load();
    }

    function goTo(i){ idx = ((i%len)+len)%len; render(); if(playing) audio.play(); }
    document.getElementById('next').onclick = ()=>goTo(idx+1);
    document.getElementById('prev').onclick = ()=>goTo(idx-1);

    let playing=false;
    document.getElementById('play').onclick=()=>{
      playing=!playing;
      document.getElementById('play').textContent = playing?'▌▌':'▶';
      if(playing) audio.play(); else audio.pause();
    }

    audio.addEventListener('timeupdate',()=>{
      const p = (audio.currentTime / audio.duration)*100;
      progFill.style.width = p+'%';
      const m = Math.floor(audio.currentTime/60);
      const s = Math.floor(audio.currentTime%60).toString().padStart(2,'0');
      duration.textContent = `${m}:${s}`;
    });

    // === CONTROL DE VOLUMEN ===
    const volRange = document.getElementById('volRange');
    volRange.addEventListener('input',()=>{
      audio.volume = volRange.value;
    });


    // === MOSTRAR / OCULTAR LETRAS ===
    const lyricsBtn = document.getElementById('lyricsBtn');
    lyricsBtn.addEventListener('click',()=>{
      lyricsPanel.classList.toggle('show');
    });

    render();
  </script>
  <script src="../scripts/main.js"></script>
</body>
</html>
